name: Check provider sources

on:
    workflow_dispatch:
    schedule:
        - cron: "0 9 1 * *"

permissions:
    contents: read

jobs:
    check-sources:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run check:sources
